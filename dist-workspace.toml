[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# npm is published by our own workflow as platform packages + shim (see
# .github/workflows/publish-npm.yml), not by dist's download-shim installer.
publish-jobs = ["./publish-npm"]
# Prereleases publish to npm so a `v<version>-rc.N` tag rehearses the real pipeline — real
# archives, real registry, real provenance — before the version that claims `latest`.
publish-prereleases = true

# dist 0.32.0 defaults to runner images that GitHub is retiring: macos-14 brownouts start
# 2026-10-05, and ubuntu-22.04 entered deprecation 2026-09-17. Pin the successors.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

# publish-npm checks out the repo, so it needs contents: read on top of dist's default id-token grant.
[dist.github-custom-job-permissions]
publish-npm = { contents = "read", id-token = "write" }

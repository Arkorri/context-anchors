[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The Homebrew formula is rebuilt from the macOS and Linux archives on every release and pushed
# to this tap by the generated publish-homebrew-formula job, which authenticates with the
# HOMEBREW_TAP_TOKEN secret (see docs/RELEASING.md). Users run
# `brew install Arkorri/tap/context-anchors`. The formula keeps the package name.
tap = "Arkorri/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The release workflow runs only on tags. The stale-workflow check dist would otherwise run on
# every pull request (`dist plan`) runs in CI's `generated` job instead, so a pull request has
# one workflow run and one required check (see .github/workflows/ci.yml, docs/TESTING.md §10).
pr-run-mode = "skip"
# npm is published by our own workflow as platform packages + shim (see
# .github/workflows/publish-npm.yml), not by dist's download-shim installer.
publish-jobs = ["homebrew", "./publish-npm"]
# Prereleases publish to npm so a `v<version>-rc.N` tag rehearses the real pipeline — real
# archives, real registry, real provenance — before the version that claims `latest`. They reach
# the tap too; Homebrew has no `next` tag, but it orders 0.1.0 above 0.1.0-rc.1, so the stable
# tag that follows restores the formula and `brew upgrade` moves anyone who installed the rc.
publish-prereleases = true

# dist 0.32.0 defaults to runner images that GitHub is retiring: macos-14 brownouts start
# 2026-10-05, and ubuntu-22.04 entered deprecation 2026-09-17. Pin the successors. `global` is
# the runner for the non-target jobs: plan, host, announce, and the global artifacts build.
# The Intel macOS archive is cross-compiled on the Apple Silicon runner (dist adds the target with
# rustup): it was the slowest build by ninety seconds on macos-15-intel, and the npm verify job
# still executes the binary on a real Intel runner before anything is published.
[dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

# publish-npm checks out the repo, so it needs contents: read on top of dist's default id-token grant.
[dist.github-custom-job-permissions]
publish-npm = { contents = "read", id-token = "write" }

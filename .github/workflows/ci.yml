name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its running checks. Runs on main are never cancelled: they
# are the only test of the merged tree (docs/TESTING.md §9).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --locked --no-fail-fast
      # Dogfood: the repository's own references, checked with the binary the tests just built.
      # Annotations put any finding on the pull-request diff.
      - run: cargo run --locked --bin anchr -- check --strict --format github

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --no-report
      # The thresholds exit non-zero without naming a file, so the table has to be printed.
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --fail-under-file-lines 70
      - run: cargo llvm-cov report --fail-under-lines 88

  msrv:
    name: check on MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  generated:
    name: script tests and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test 'scripts/tests/**/*.test.mjs'
      - run: node scripts/src/linguist/gen-extensions.mjs --check
      - run: node scripts/src/docs/gen-index.mjs --check
      # The user guide builds as a site (site/book.toml); a marker the site cannot turn into a
      # link fails here rather than on the deploy from main (.github/workflows/pages.yml).
      - name: install mdbook
        run: |
          version=$(node scripts/src/site/build.mjs --mdbook-version)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: node scripts/src/site/build.mjs && mdbook build site
      # The release workflow is generated by dist and runs only on tags; `dist plan` here is the
      # check that it is fresh against dist-workspace.toml, at the version that file names.
      - name: install dist
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - run: dist plan

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The composite action installs the *latest release* and checks the current docs with it, so
  # this proves the install path on every platform, not the code under review (the rust job does).
  action:
    name: the action installs a release and checks the repo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          version: latest

  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [parse-target, lex, markdown-regions, source-regions, config]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

  # The one required status check (.github/rulesets/main.json). It needs every job above, so
  # adding or renaming a job never touches the ruleset.
  ci-ok:
    name: ci-ok
    needs: [rust, coverage, msrv, generated, supply-chain, action, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$RESULTS"
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::not every job succeeded: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi

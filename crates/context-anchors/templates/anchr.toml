# anchr configuration. Every key is optional; the values shown are the defaults.
# Docs: ANCHR.md (written by `anchr init`) or https://github.com/averykempton/context-anchors

# [root]
# name = "<this directory's name>"   # how other roots refer to this one; letters, digits, _ -

# External roots. `@ref[claude:#some-id]` resolves in the root named `claude`.
# Relative paths are resolved against this file; `~` is expanded.
# [roots]
# claude = "~/.claude"

# [scan]
# include = []                 # empty: every file with a known container is scanned
# max-file-bytes = 2097152     # larger files are reported as unverified, not scanned
# parse-budget-ms = 5000       # per-file tree-sitter parse budget

# Two questions. `paths`: which files anchr never looks at. `tokens`: which strings it never
# proposes as references.
# [ignore]
# paths = []                   # gitignore syntax, layered on .gitignore, which applies as git
#                              # applies it (inside a repository, stopping at the nearest .git).
#                              # A listed path is not scanned, not checked, and not a valid
#                              # target. Hidden directories such as .claude/ are scanned and
#                              # .git/ never is, so list the ones to skip here, e.g. [".venv/"]
# tokens = []                  # globs matched against the whole string: "CLAUDE.md" is only
#                              # that word, "src/**" is everything under src/, "**/CLAUDE.md"
#                              # is the word at any depth. Never a prefix unless you write one.

# [containers]
# markdown = ["md", "markdown"]
# plaintext = ["txt"]
# Source files are recognised by extension: rs, ts, tsx, mts, cts, js, jsx, mjs, cjs, py, pyi, go.

# [check]
# unverified = "report"        # "error" makes every unverified finding fail the check

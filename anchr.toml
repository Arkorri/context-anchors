# anchr checks its own documentation. Defaults everywhere; this file marks the root.

[root]
name = "context-anchors"

[scan]
# Generated build output and the per-crate test snapshots are not documentation.
exclude = ["target/**", "**/snapshots/**"]

[coverage]
# Archived research: kept valid, never asked for more annotation.
exclude = ["docs/research/**"]
# Files that live in a user's repository are never references here.
ignore = [
  "CLAUDE.md", "AGENTS.md", "GEMINI.md", "package.json", "build.rs",
  "CHANGELOG.md", ".claude-plugin/marketplace.json", "dist-manifest.json", ".claude/",
  "anchr.toml",
  # A registry, a file inside the tree-sitter grammars, and example paths under a `src/` this
  # repository does not have.
  "crates.io", "tags.scm", "src/",
]

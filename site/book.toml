# The documentation site, rendered by mdBook and published to GitHub Pages on every push to
# main that touches the guide. The pages are written in docs/guide/ with anchr's markers, so this
# repository checks them; scripts/src/site/build.mjs copies them into docs/guide/ here with the markers
# rewritten as links and writes SUMMARY.md in sidebar order. docs/ and book/ here are generated and
# ignored by git.
#
#   node scripts/src/site/build.mjs && mdbook serve site

[book]
title = "context-anchors"
description = "Your docs point at your code. anchr tells you when they stop matching."
authors = ["Arkorri"]
language = "en"
src = "docs/guide"

[build]
build-dir = "book"

[output.html]
site-url = "/context-anchors/"
# The site's two palettes (theme/custom.css) occupy mdBook's `light` and `ayu` slots: a first
# visit follows the system preference between them, the header menu offers Auto, Light, and
# Dark, and a choice made there is remembered by the browser.
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/Arkorri/context-anchors"
edit-url-template = "https://github.com/Arkorri/context-anchors/edit/main/{path}"
# theme/ overrides mdBook's fonts and favicon; the rest of the look is these two files.
additional-css = ["theme/custom.css"]
additional-js = ["theme/site.js"]

[workspace]
resolver = "3"
members = ["crates/anchr-core", "crates/context-anchors"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/averykempton/context-anchors"

[workspace.dependencies]
anchr-core = { path = "crates/anchr-core", version = "0.0.1" }

anstream = "1.0"
annotate-snippets = "0.12"
anyhow = "1.0"
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
dunce = "1.0"
globset = "0.4"
ignore = "0.4"
line-index = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
thiserror = "2.0"
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

assert_cmd = "2.2"
insta = { version = "1.48", features = ["json"] }
predicates = "3.1"
proptest = "1.11"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
redundant_clone = "warn"
needless_pass_by_value = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
overflow-checks = true
panic = "unwind"

# The profile that 'dist' will build with; identical to release so shipped binaries match
# what CI tests and the size budget measure.
[profile.dist]
inherits = "release"
